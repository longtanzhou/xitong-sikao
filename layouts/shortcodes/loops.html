<div class="loops">
  <figure class="loop-fig">
    <figcaption><strong>增强回路（R）</strong> · 自我强化，驱动指数增长或衰败</figcaption>
    <svg viewBox="0 0 320 200" role="img" aria-label="增强回路示意图">
      <defs><marker id="arr" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="currentColor"/></marker></defs>
      <g class="loop-svg">
        <path d="M160,40 C240,40 270,100 250,140 C230,180 120,190 80,150 C50,115 70,60 130,45" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
        <text x="160" y="30" text-anchor="middle" class="svg-label">满意用户 → 口口相传 → 销量增长 → …</text>
        <text x="160" y="115" text-anchor="middle" class="svg-r">R</text>
        <text x="248" y="95" class="svg-plus">+</text>
        <text x="70" y="95" class="svg-plus">+</text>
      </g>
    </svg>
    <p class="fig-note">判定：沿闭合回路数"−"连接的个数，零或偶数个即为增强回路。征兆："越来越……"、"良性 / 恶性循环"。</p>
  </figure>
  <figure class="loop-fig">
    <figcaption><strong>调节回路（B）</strong> · 使系统向目标靠近（寻的）</figcaption>
    <svg viewBox="0 0 320 200" role="img" aria-label="调节回路示意图">
      <g class="loop-svg">
        <path d="M160,40 C240,40 270,100 250,140 C230,180 120,190 80,150 C50,115 70,60 130,45" fill="none" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
        <text x="160" y="30" text-anchor="middle" class="svg-label">水位差距 → 调整水流 → 实际水位 → …</text>
        <text x="160" y="115" text-anchor="middle" class="svg-r">B</text>
        <text x="248" y="95" class="svg-plus">+</text>
        <text x="70" y="95" class="svg-minus">−</text>
      </g>
    </svg>
    <p class="fig-note">判定："−"连接为奇数个即为调节回路。三种作用机理：阻力 / 限制因素、干预 / 问题解决、平衡 / 实现目标。</p>
  </figure>
  <figure class="loop-fig">
    <figcaption><strong>时间延迟（=）</strong> · 箭头中间画两道短横线表示</figcaption>
    <svg viewBox="0 0 320 120" role="img" aria-label="时间延迟示意图">
      <g class="loop-svg">
        <line x1="40" y1="60" x2="280" y2="60" stroke="currentColor" stroke-width="2" marker-end="url(#arr)"/>
        <line x1="150" y1="52" x2="150" y2="68" stroke="currentColor" stroke-width="3"/>
        <line x1="160" y1="52" x2="160" y2="68" stroke="currentColor" stroke-width="3"/>
        <text x="60" y="40" class="svg-label">行动</text>
        <text x="240" y="40" class="svg-label">结果</text>
        <text x="160" y="95" text-anchor="middle" class="svg-label">延迟：信息延迟 / 物理延迟</text>
      </g>
    </svg>
    <p class="fig-note">对增强回路使人麻痹（温水煮青蛙），对调节回路引发震荡与矫枉过正（淋浴器、啤酒游戏）。延迟并非越短越好，它是敏感的政策杠杆点。</p>
  </figure>
</div>
