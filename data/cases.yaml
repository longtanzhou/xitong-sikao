# 令人印象深刻的案例（12 个）
- title: 倒一杯水
  text: 手转动水龙头、眼睛观察水位、大脑设定并比对期望水位、再调整手部动作，形成闭环，直到水位达标。这个最简单的日常动作就是一个完整系统——实体、连接、目标三要素俱全，说明系统无所不在。
- title: 柳传志"拧螺丝"
  text: 给汽车轮胎上五个螺丝，不能逐个紧到底，必须先轻轻固定、再逐个轮流紧一些，直到全部到位。这说明系统思考就是统筹兼顾、把握节奏，而非线性地"一个一个搞定"。
- title: 楚灵王好细腰
  text: 据《墨子·兼爱》记载，楚灵王偏好细腰，臣子便节食效仿，一年后朝廷"有黧黑之色"。这说明领导者的偏好属于系统结构的层面，会塑造整个组织的行为——"企业文化就是一把手文化"。
- title: 啤酒游戏
  text: MIT 在 1960 年代开发的产销模拟，只有四个角色、每周只做一个订购决策；上万次实验都出现"先库存枯竭、大量欠货，后库存暴增"的牛鞭效应。这说明问题深藏于人类思考与人际互动的基本习性之中。
- title: 离职的魔咒
  text: 某公司技术骨干离职，于是高薪挖角；老员工心理失衡，更多人离职；公司继续挖角、改善福利，离职率却越来越高。"高薪挖角"是双刃剑，其副作用形成的恶性增强回路抵消了改善福利的效果——"今日的问题往往来自昨天的解"。
- title: 莲雾大王
  text: 台湾屏东果农与便利店签直销协议、送货到家保证最佳熟度；"口碑效应"带来客户增长，销量收入增长又支撑扩大产能，两个增强回路相互促进，形成"成长引擎"。这说明增长背后是可被发现、设计的增强回路结构。
- title: 青蛙与睡莲
  text: 睡莲每天翻倍、50 天覆盖池塘；青蛙需要 10 天来实施阻止方法，最晚须在第 40 天动手，而此时睡莲仅覆盖不到千分之一。这说明指数增长初期极难察觉，等看到危险时一切都晚了——必须"见微知著、防微杜渐"。
- title: 陌生旅馆的淋浴器
  text: 旅客调节水温时忽冷忽热、反复调节总是矫枉过正，因为水温变化存在管道传输延迟。这说明时间延迟出现在调节回路上会使系统震荡，人们的干预往往矫枉过正。
- title: 电表的位置
  text: 阿姆斯特丹郊区相同的别墅中，电表装在前厅（看得见）的家庭，比装在地下室的家庭用电量少三分之一。这说明缩短信息感知延迟就能改变行为——时间延迟是重要的政策杠杆点。
- title: 人民航空公司
  text: 1980 年成立，五年内以低票价、高服务热情成为全美第五大航空公司；但乘客增长超出服务容量，公司未投入招聘培训、反而降低服务标准，服务品质恶化、客户流失，增强回路逆转酿成悲剧。这说明在成长上限面前降低标准而非扩充产能，会把良性循环拖成恶性循环。
- title: 皮格马利翁效应
  text: 1968 年罗森塔尔在一所小学随意拟定"最有发展前途者"名单交给教师，八个月后名单上的学生成绩提高更快、性格更开朗。这说明教师的期望会自我实现——是"富者愈富"基模在教育领域的典型表现。
- title: Hotmail 引爆市场
  text: 1996 年发布的免费邮箱初期增长缓慢；团队在每封发出的邮件后加了一条横幅广告，几周内注册量爆发，6 个月超 100 万用户，18 个月达 1200 万。这说明病毒式营销的威力——产品本身成为传播媒介，病毒系数大于 1 即呈指数级增长。
