# 经典金句（15 条）
- text: 系统是由一群相互连接的实体构成的一个整体。
  source: 本书
- text: 如果把构成系统的各实体的特性看成"1"，那么系统整体的特性就不是各实体特性的算术累加或平均，也就是说"1+1≠2"。
  source: 本书
- text: 系统的精髓就在于实体之间的连接。
  source: 本书
- text: 系统的行为由其结构决定。
  source: 本书
- text: 没有复杂的简单，是鲁莽；没有简单的复杂，是迂腐。
  source: 作者
- text: 今日的问题来自昨天的解。
  source: 圣吉
- text: 越用力推，系统的反弹力量越大。
  source: 圣吉
- text: 渐糟之前先渐好。
  source: 圣吉
- text: 有时候，对策比问题更糟。
  source: 圣吉
- text: 你用什么样的语言，就决定了你有什么样的心智模式。
  source: 梅多斯
- text: 把一头大象切成两半，并不会得到两头小象。
  source: 圣吉
- text: 非知之艰，行之惟艰。
  source: 《尚书·说命中》
- text: 纸上得来终觉浅，绝知此事要躬行。
  source: 陆游
- text: 凡事豫则立，不豫则废。
  source: 《礼记·中庸》
- text: 无他，惟手熟尔。
  source: 欧阳修《卖油翁》
