# 系统基模（10 种）
# category: chengzhang = 以推动成长为基础；jiejue = 以解决问题为基础
- name: 关键转折点
  category: chengzhang
  category_label: 推动成长
  dingyi: 自我增强的过程，但行动与结果之间有时间延迟：初期进展缓慢，一旦积累到"临界值"或"引爆点"，就会发生迅猛变革；若意识不到延迟的存在，容易过早放弃，导致"功亏一篑"。
  jiegou: 一个带有明显时间延迟的增强回路。
  anli: 某咨询公司拓展培训业务，半年亏损后终止；半年之后客户主动上门，却已无力承接。
- name: 成长上限
  category: chengzhang
  category_label: 推动成长
  dingyi: 系统开始加速增长，随后增长趋缓、停滞或震荡，甚至逆转、加速下滑。
  jiegou: 一个增强回路（驱动增长）加上一个调节回路（限制因素开始起作用）。
  anli: 人民航空公司以低票价快速扩张，乘客增长超出服务容量，服务品质下降、客户流失。
- name: 富者愈富
  category: chengzhang
  category_label: 推动成长
  dingyi: 两项活动争夺有限资源，成功的一方获得更多支持、表现更好，另一方则陷入恶性循环。
  jiegou: 两个增强回路（一良性、一恶性）；隐含假设是资源有限，且分配标准是既往的成功。
  anli: 皮格马利翁效应（罗森塔尔实验）；东西部城市之间的人才循环。
- name: 共同悲剧
  category: chengzhang
  category_label: 推动成长
  dingyi: 许多个体基于各自利益共同使用有限资源，收益先增后减，最终导致资源枯竭。
  jiegou: 多个本地增强回路（个体追求成长）加上一个全局调节回路（资源极限）。
  anli: 哈丁《公地悲剧》；福特林肯大陆的"电力供应悲剧"。
- name: 成长与投资不足
  category: chengzhang
  category_label: 推动成长
  dingyi: 成长接近上限时，没有提前投资扩充产能，反而降低绩效标准，导致成长受阻甚至逆转。
  jiegou: 成长上限与舍本逐末的组合：增强回路加上产能制约的调节回路，再加上标准降低的调节回路。
  anli: 人民航空公司未投入招聘培训、反而降低服务标准，致使增强回路逆转；学校盲目扩招。
- name: 延迟反应
  category: jiejue
  category_label: 解决问题
  dingyi: 行动与结果之间存在时间延迟，意识不到延迟就会过度矫正，或者轻易放弃。
  jiegou: 一个调节回路加上时间延迟。
  anli: 房地产开发周期导致供过于求；啤酒游戏中的"牛鞭效应"。
- name: 饮鸩止渴
  category: jiejue
  category_label: 解决问题
  dingyi: 短期见效的对策会产生越来越严重的后遗症，问题不断恶化，让人难以自拔。
  jiegou: 一个解决问题的调节回路，加上"对策的后遗症使问题恶化"的增强回路。
  anli: 公司资金短缺，于是借高息贷款、降价促销，结果品牌受损、现金流更糟。
- name: 舍本逐末
  category: jiejue
  category_label: 解决问题
  dingyi: 常用见效快的"症状解"（治标），导致"根本解"的能力逐渐萎缩，对症状解产生更大的依赖。
  jiegou: 两个调节回路（症状解与根本解）加上一个增强回路（症状解削弱根本解的能力）。
  anli: 借酒消愁愁更愁；靠创新成功的公司逐渐失去创新能力。
- name: 目标侵蚀
  category: jiejue
  category_label: 解决问题
  dingyi: 短期的"症状解"就是放松要求、降低长期性的根本目标。
  jiegou: 两个调节回路：改变现状（根本解，但有延迟）与降低目标（症状解）。
  anli: 运动目标从每天半小时一路滑向放弃；公司的交货期标准越拉越长。
- name: 恶性竞争
  category: jiejue
  category_label: 解决问题
  dingyi: 竞争双方把自身利益建立在超过对方的基础上，对立不断升级。
  jiegou: 两个调节回路（各方回应对方的威胁）加上一个增强回路（对立升级）。
  anli: 婴儿车价格战导致两败俱伤；美苏军备竞赛。
